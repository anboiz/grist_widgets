<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>InfoEnergie Widget</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome pour les icônes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Chargement de l'API Grist pour les widgets -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    /* Styles CSS pour le widget */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
    }
    #widget-container {
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 10px;
      max-width: 600px;
    }
    .field {
      margin-bottom: 8px;
    }
    .field-label {
      font-weight: bold;
    }
    .nav-buttons {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 5px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="widget-container">
    <h3 id="widget-title">Informations Énergie</h3>
    <div id="fields-container"></div>
    <div class="nav-buttons">
      <button id="prev-btn" disabled>← Précédent</button>
      <button id="next-btn" disabled>Suivant →</button>
    </div>
    <div class="container mt-3">
    <div class="card">
      <div class="card-header">
        <h5 class="card-title">Gestion des Objets</h5>
      </div>
      <div class="card-body">
        <div id="object-form">
        </div>
      </div>
  </div>
  <!-- Votre script principal -->
  <script src="script.js"></script>
</body>
</html>
