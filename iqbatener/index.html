<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfoEnergie Widget</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script
    src="https://code.jquery.com/jquery-4.0.0.min.js"
    integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
    crossorigin="anonymous">
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/css/bootstrap-select.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/js/bootstrap-select.min.js"></script>

  <!-- Font Awesome pour les icônes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Chargement de l'API Grist pour les widgets -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    /* Styles CSS pour le widget */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
    }
      /* Assurez-vous que le conteneur des boutons prend toute la largeur */
    .nav-buttons-container {
      width: 100%;
    }

    select option {
      margin: 40px;
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.4);
    }

    select option[value="A"] {
      background:  #0d6efd;
    }

  </style>
</head>
<body>
  <div id="widget-container" class="mt-3">
    <h3 id="widget-title">Informations Énergie</h3>
    <div id="fields-container"></div>
    <!-- Conteneur pour les boutons -->
    <div class="nav-buttons-container d-flex justify-content-between mt-3">
      <button id="prev-btn" class="btn btn-primary">← Précédent</button>
      <button id="next-btn" class="btn btn-primary">Suivant →</button>
    </div>
    <div class="container mt-3">
      <div class="card">
        <div class="card-header">
          <h5 class="card-title">Carnet énergie</h5>
        </div>
        <div class="card-body">
          <div id="object-form">
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Votre script principal -->
  <script src="script.js"></script>

</body>
</html>
