<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Widget Grist</title>

  <!-- Bootstrap 5 CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Votre CSS personnalisé -->
  <link rel="stylesheet" href="styles.css">

  <!-- TypeScript (optionnel, si vous utilisez TS et le compilez en JS) -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/typescript@5.0.0/lib/typescript.js"></script> -->
</head>
<body>
  <!-- Structure HTML de votre widget -->
  <div id="widget-container" class="container mt-3">
    <h1 id="widget-title">Mon Widget</h1>
    <div id="widget-content" class="card">
      <div class="card-body">
        <p id="widget-message">Contenu dynamique ici.</p>
        <button id="widget-button" class="btn btn-primary">Cliquez-moi</button>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Votre script principal -->
  <script src="script.js"></script>
</body>
</html>
